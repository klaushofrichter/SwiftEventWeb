version: 2

# Version updates. Note these are only half the story: the security half
# (Dependabot alerts + security updates) is a repo setting, not config, and
# both must stay switched on under Settings > Code security.
#
# PRs land on develop, the default branch, and reach the site through the
# normal develop -> prod promotion that deploy.yml publishes. Nothing here
# deploys on its own. test-develop.yml and codeql.yml previously only ran on
# PRs to prod, which is not where Dependabot opens them; they now run on PRs
# to develop as well, so these bumps are tested before they are merged rather
# than for the first time at the promotion PR.
updates:
  # Application dependencies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      # One PR per group rather than per package: the checks here install
      # Playwright browsers and build the app, and a dozen single-package PRs
      # would run all of that a dozen times for changes reviewed together
      # anyway.
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    # Majors stay ungrouped and arrive one at a time - those are the ones that
    # need reading, not batch-merging.

  # Workflow actions. Without this, action majors are only noticed when a
  # runtime deprecation warning starts appearing in logs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  # The cors-proxy Worker has no package.json of its own - wrangler is invoked
  # through npx in deploy.sh - so there is nothing here for npm to track.
